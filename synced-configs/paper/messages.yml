# Prefix prepended by MessageService.message(...) to most command feedback messages.
prefix: "<dark_gray>[<gold>CoreCaseX</gold>]</dark_gray> "

# Sent when a console or command block uses a player-only command.
only-players: "<red>Only players can use this command.</red>"

# Sent when a player lacks the required permission.
no-permission: "<red>You do not have permission.</red>"

# Sent to the reporter after a case is created successfully.
case-created: "<green>Case <white>#{id}</white> created successfully. Staff has been notified.</green>"

# Sent after a staff member claims a case.
case-claimed: "<yellow>Case <white>#{id}</white> has been claimed by <white>{staff}</white>.</yellow>"

# Sent when a case ID does not exist.
case-not-found: "<red>Case #{id} was not found.</red>"

# Generic success message for case updates.
case-updated: "<green>Case #{id} updated.</green>"

# Sent after a case is resolved or rejected.
case-closed: "<green>Case #{id} has been closed.</green>"

# Sent after a resolved or rejected case is archived.
case-archived: "<green>Case #{id} archived.</green>"

# Sent when a typed case ID is not a positive number.
invalid-case-id: "<red>Invalid case id.</red>"

# Sent when a priority argument is not LOW, NORMAL, HIGH, or URGENT.
invalid-priority: "<red>Invalid priority. Use LOW, NORMAL, HIGH, or URGENT.</red>"

# Sent when a status argument is not an allowed non-closed workflow status.
invalid-status: "<red>Invalid status. Use OPEN, CLAIMED, WAITING_PLAYER, or WAITING_STAFF.</red>"

# Sent when /case assign targets a player who is not currently online.
assignee-online-required: "<red>Assignee must be online.</red>"

# Sent after /case reload completes.
reload-complete: "<green>CoreCaseX configuration reloaded.</green>"

# Root usage text for /case.
usage-case-root: "<yellow>Usage: /case [list|view|board|open|claim|assign|priority|status|archive|reload|debug]</yellow>"

# Usage text for /case view.
usage-case-view: "<yellow>Usage: /case view <id></yellow>"

# Usage text for /case open.
usage-case-open: "<yellow>Usage: /case open <id></yellow>"

# Usage text for /case claim.
usage-case-claim: "<yellow>Usage: /case claim <id></yellow>"

# Usage text for /case assign. The assignee must be online.
usage-case-assign: "<yellow>Usage: /case assign <id> <online-staff></yellow>"

# Usage text for /case priority.
usage-case-priority: "<yellow>Usage: /case priority <id> <LOW|NORMAL|HIGH|URGENT> [reason]</yellow>"

# Usage text for /case status. Closed statuses use resolve/reject/archive actions instead.
usage-case-status: "<yellow>Usage: /case status <id> <OPEN|CLAIMED|WAITING_PLAYER|WAITING_STAFF> [reason]</yellow>"

# Usage text for /case archive.
usage-case-archive: "<yellow>Usage: /case archive <id></yellow>"

# In-game notification sent to staff when a new case is created.
staff-new-case: "<gold>New Case #{id}</gold> <gray>-</gray> <white>{type}</white> by <white>{reporter}</white>"

# In-game notification sent to staff when a reporter replies.
staff-player-replied: "<gold>Case #{id}</gold> <gray>-</gray> <yellow>{reporter}</yellow> replied."

# In-game notification sent to a staff member when a case is assigned to them.
staff-assigned-to-you: "<gold>Case #{id}</gold> <gray>-</gray> assigned to you."

# Sent to a reporter after they add a reply.
player-reply-added: "<green>Your reply was added to Case #{id}.</green>"

# Sent to an online reporter when staff adds a player-visible reply.
staff-reply-received: "<yellow>Staff replied to Case #{id}.</yellow>"

# Sent to an online reporter when staff requests more information.
info-requested: "<yellow>Staff requested more information for Case #{id}.</yellow>"

# Sent to an online reporter when their case is resolved.
resolved-notice: "<green>Your Case #{id} has been resolved.</green>"

# Sent to an online reporter when their case is rejected.
rejected-notice: "<red>Your Case #{id} has been rejected.</red>"

# Inventory GUI text used by the primary in-game UI. Dialogs remain for typed input.
menus:
  # Inventory window title templates.
  titles:
    # Main /case inventory title.
    main: "<gold>CoreCaseX</gold>"
    # Case type selection inventory title.
    case-types: "<gold>Create Case</gold>"
    # Player case list inventory title.
    my-cases: "<gold>My Cases</gold>"
    # Player case detail inventory title.
    case-detail: "<gold>Case Detail</gold>"
    # Staff board filter inventory title.
    staff-board: "<aqua>Staff Case Board</aqua>"
    # Staff case list inventory title.
    staff-case-list: "<aqua>Staff Cases</aqua>"
    # Staff case detail inventory title.
    staff-case-detail: "<gold>Staff Case Detail</gold>"
    # Staff action inventory title.
    staff-actions: "<gold>Staff Actions</gold>"
    # Staff assign/reassign inventory title.
    assign: "<gold>Assign / Reassign</gold>"
    # Priority selection inventory title.
    priority: "<gold>Change Priority</gold>"
    # Status selection inventory title.
    status: "<gold>Change Status</gold>"
  # Configurable inventory items. Lore uses \n for multiple lines.
  items:
    # Main menu create case item.
    create-case:
      material: WRITABLE_BOOK
      name: "<green>Create Case</green>"
      lore: "<gray>Open a new staff support case.</gray>\n<yellow>Click to choose a case type.</yellow>"
    # Main menu player cases item.
    my-cases:
      material: BOOK
      name: "<yellow>My Cases</yellow>"
      lore: "<gray>View your submitted cases.</gray>"
    # Main menu staff board item.
    staff-board:
      material: COMPASS
      name: "<aqua>Staff Board</aqua>"
      lore: "<gray>Browse and triage staff cases.</gray>"
    # Main menu direct staff lookup item.
    open-by-id:
      material: NAME_TAG
      name: "<aqua>Open by ID</aqua>"
      lore: "<gray>Open a case by numeric ID.</gray>"
    # Generic back navigation item.
    back:
      material: ARROW
      name: "<gray>Back</gray>"
      lore: "<gray>Return to the previous menu.</gray>"
    # Generic close inventory item.
    close:
      material: BARRIER
      name: "<red>Close</red>"
      lore: "<gray>Close this menu.</gray>"
  # Reserved for future shared lore fragments.
  lore: {}
  # Reserved for future navigation labels.
  navigation: {}
  # Reserved for future status/priority text overrides.
  status: {}

# Paper Dialog input text. Dialogs are now used for typed input and compact forms, not as the primary navigation UI.
dialogs:
  # Dialog title templates.
  titles:
    # Title for the main CoreCaseX menu.
    corecasex: "<gold>CoreCaseX</gold>"
    # Title for the case type selection menu.
    open-a-case: "<gold>Open a Case</gold>"
    # Title for staff tools.
    staff-tools: "<aqua>Staff Tools</aqua>"
    # Title for the support request form.
    support-request: "<gold>Support Request</gold>"
    # Title for the player report form.
    report-a-player: "<gold>Report a Player</gold>"
    # Title for the bug report form.
    bug-report: "<gold>Bug Report</gold>"
    # Title for the lost item/death issue form.
    lost-items-death-issue: "<gold>Lost Items / Death Issue</gold>"
    # Title for the grief/theft form.
    grief-theft: "<gold>Grief / Theft</gold>"
    # Title for review-before-submit dialogs.
    confirm-case-submission: "<gold>Confirm Case Submission</gold>"
    # Title for the player case list.
    your-cases: "<gold>Your Cases</gold>"
    # Title for player case details.
    case-detail: "<gold>Case <white>#{case_id}</white></gold>"
    # Title for the staff board filter menu.
    staff-case-board: "<aqua>Staff Case Board</aqua>"
    # Title for a staff board opened with one filter.
    staff-board-filter: "<aqua>Staff Case Board</aqua> <gray>-</gray> <white>{filter}</white>"
    # Title for staff case details.
    staff-case-detail: "<gold>Case <white>#{case_id}</white></gold> <gray>-</gray> <aqua>Staff</aqua>"
    # Title for the staff actions dialog.
    staff-case-actions: "<gold>Case <white>#{case_id}</white></gold> <gray>-</gray> <yellow>Actions</yellow>"
    # Title for the assign/reassign case input.
    assign-case: "<gold>Assign / Reassign Case</gold>"
    # Title for the priority change input.
    change-priority: "<gold>Change Priority</gold>"
    # Title for the status change input.
    change-status: "<gold>Change Status</gold>"
    # Title for the player reply input.
    reply-to-case-case: "<gold>Reply to Case <white>#{case_id}</white></gold>"
    # Title for the staff reply input.
    reply-to-player: "<gold>Reply to Player</gold>"
    # Title for the request-info input.
    request-info: "<gold>Request Info</gold>"
    # Title for the internal note input.
    internal-note: "<gold>Internal Note</gold>"
    # Title for the resolve case dialog.
    resolve-case: "<green>Resolve Case</green>"
    # Title for the reject case dialog.
    reject-case: "<red>Reject Case</red>"
    # Title for categorized case information sections.
    case-info-section: "<gold>Case <white>#{case_id}</white></gold> <gray>-</gray> <aqua>{section}</aqua>"

  # Short body text used in dialogs.
  body:
    # Main menu instruction.
    main: "<gray>Select a workflow.</gray>"
    # Case type menu instruction.
    case-type-menu: "<gray>Choose the type that best matches the issue.</gray>"
    # Staff tools instruction.
    staff-tools: "<gray>Open a board or use a direct case lookup.</gray>"
    # Support request form instruction.
    support-request: "<gray>Describe the issue. Attach location only when it helps staff understand the problem.</gray>"
    # Player report reason summary.
    player-report-reasons: "<dark_gray>Reasons:</dark_gray> <white>{reasons}</white>"
    # Bug report category summary.
    bug-report-categories: "<dark_gray>Categories:</dark_gray> <white>{categories}</white>"
    # Latest death summary in the lost item form.
    lost-items-death-summary: "<gray>{death_summary}</gray>"
    # Grief/theft form instruction.
    grief-theft: "<gray>Attach your current location or write a manual location, then describe what happened.</gray>"
    # Empty player case list text.
    your-cases-empty: "<gray>You have not opened any cases yet.</gray>"
    # Player case list instruction.
    your-cases-select: "<gray>Select a case to inspect.</gray>"
    # Staff board filter menu instruction.
    staff-board-filter-select: "<gray>Choose a staff board filter.</gray>"
    # Empty staff board text.
    staff-board-empty: "<gray>No cases match this filter.</gray>"
    # Staff board case selection instruction.
    staff-board-select-case: "<gray>Select a case to inspect.</gray>"

  # Input labels and default values used by Dialog forms.
  inputs:
    # Generic description input.
    description:
      # Label shown above the description text input.
      label: "Description"
      # Default text for the description input.
      default: ""
    # Boolean input for attaching current location.
    attach-location:
      # Label shown for the attach-location control.
      label: "Attach current location"
      # Default text placeholder for attach-location.
      default: ""
    # Boolean input for attaching latest death evidence.
    attach-death:
      # Label shown for the attach-death control.
      label: "Attach latest death"
      # Default text placeholder for attach-death.
      default: ""
    # Label/default text for yes values in boolean controls.
    bool-yes:
      # Text shown for the yes option.
      label: "yes"
      # Default yes text.
      default: "yes"
    # Label/default text for no values in boolean controls.
    bool-no:
      # Text shown for the no option.
      label: "no"
      # Default no text.
      default: "no"
    # Target player input for player reports.
    target-player:
      # Label shown above the target player input.
      label: "Target player"
      # Default text for the target player input.
      default: ""
    # Legacy player report reason input text. The primary reason choice is now an inventory menu.
    reason:
      # Label shown if a Dialog reason input is used by a legacy/custom flow.
      label: "Reason"
      # Default selected reason. {default} is filled from case-types.yml.
      default: "{default}"
    # Legacy bug report category input text. The primary category choice is now an inventory menu.
    category:
      # Label shown if a Dialog category input is used by a legacy/custom flow.
      label: "Category"
      # Default selected category. {default} is filled from case-types.yml.
      default: "{default}"
    # Manual location text input for grief/theft cases.
    manual-location:
      # Label shown above the manual location input.
      label: "Manual location if needed"
      # Default text for the manual location input.
      default: ""
    # Claimed lost item text input.
    claimed-lost-items:
      # Label shown above the claimed items input.
      label: "Claimed lost items"
      # Default text for the claimed items input.
      default: ""
    # Staff priority selector.
    priority:
      # Label shown for the priority selector.
      label: "Priority"
      # Default selected priority. {default} is filled by the dialog.
      default: "{default}"
    # Staff status selector.
    status:
      # Label shown for the status selector.
      label: "Status"
      # Default selected status. {default} is filled by the dialog.
      default: "{default}"
    # Resolve outcome input.
    outcome:
      # Label shown above the resolve outcome input.
      label: "Outcome"
      # Default resolve outcome. {default} is filled by the dialog.
      default: "{default}"
