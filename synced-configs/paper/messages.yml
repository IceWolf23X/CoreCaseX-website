    # Compact staff action menu summary row.
    action-summary: "<dark_gray>Status</dark_gray> <green>{status}</green> <dark_gray>| Priority</dark_gray> <yellow>{priority}</yellow> <dark_gray>| Assigned</dark_gray> <yellow>{assigned}</yellow>"
    # Overview section type row.
    overview-type: "Type: {type}"
    # Overview section status row.
    overview-status: "Status: {status}"
    # Overview section priority row.
    overview-priority: "Priority: {priority}"
    # Overview section reporter row.
    overview-reporter: "Reporter: {reporter}"
    # Overview section assignee row.
    overview-assigned: "Assigned: {assigned}"
    # Overview section created time row.
